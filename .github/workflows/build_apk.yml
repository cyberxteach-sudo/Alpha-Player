name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # এটি দিয়ে ম্যানুয়ালি বাটনে ক্লিক করে APK বিল্ড করা যায়

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter (যদি প্রজেক্টটি Flutter হয়)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'

    - name: Install Dependencies
      run: flutter pub get # (Android Native হলে এটি বাদ দিয়ে ./gradlew dependencies দিন)

    - name: Build APK
      run: flutter build apk --split-per-abi # অথবা flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: IPTV-App-APK
        path: build/app/outputs/flutter-apk/app-release.apk
